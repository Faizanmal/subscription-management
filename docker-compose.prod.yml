# Production-oriented compose blueprint.
# Copy to a secure host, set env files, and put TLS in front (Caddy/nginx/Traefik).
#
# Required env files (do not commit secrets):
#   backend/.env.prod
#   frontend build args via environment or CI
#
# Minimal start:
#   docker compose -f docker-compose.prod.yml --env-file backend/.env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-swm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swm_user} -d ${POSTGRES_DB:-swm_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swm_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-swm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY for production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    expose:
      - "8000"

  celery:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A backend worker -l warning
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swm_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-swm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY for production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A backend beat -l warning
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swm_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-swm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY for production}
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    expose:
      - "3000"

  # Example reverse proxy — replace with your preferred TLS terminator.
  # caddy:
  #   image: caddy:2-alpine
  #   ports: ["80:80", "443:443"]
  #   volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]

volumes:
  postgres_data:
  redis_data:
